spring.application.name=carrito-service

# H2 solamente para pruebas automatizadas
spring.datasource.url=jdbc:h2:mem:carritodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Inventario utilizado como referencia durante pruebas
services.inventario.url=http://localhost:8084

# JWT ficticio solamente para levantar el contexto de pruebas
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/test-issuer
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/test-jwks
spring.security.oauth2.resourceserver.jwt.audiences=test-audience