spring.application.name=analitica-service

# Puerto del microservicio
server.port=8090

# ==========================================
# APACHE KAFKA - CONEXION
# ==========================================

# Brokers Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}

# Configuracion del consumidor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Leer desde el inicio si el grupo no tiene offsets registrados
spring.kafka.consumer.auto-offset-reset=earliest