server.port=8089
spring.application.name=kafka-admin-service

# =========================================================
# Kafka
# =========================================================
# Default pensado para desarrollo local (infra/kafka, 2 brokers).
# En AWS, fijar vía variable de entorno con las IPs privadas de los 3
# brokers, por ejemplo:
#   KAFKA_BOOTSTRAP_SERVERS=172.31.43.118:9092,172.31.43.118:9093,172.31.43.118:9094
# Nunca se deja un valor de AWS como default: el servicio debe poder
# arrancar localmente sin depender de esa infraestructura.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}

# El servicio debe arrancar aunque Kafka no esté disponible;
# Spring solo deja un log claro en vez de abortar el contexto.
spring.kafka.admin.fail-fast=false

# Sin este timeout, el KafkaAdmin autoconfigurado usa el default de Kafka
# (hasta 2 minutos) y bloquea el arranque del contexto mientras reintenta
# contactar al clúster. 10s es suficiente para detectar que no hay
# conexión y seguir arrancando igual.
spring.kafka.admin.operation-timeout=10s

# Timeouts cortos para que la API REST no quede colgada si Kafka está caído.
kafka.admin.request-timeout-ms=${KAFKA_ADMIN_REQUEST_TIMEOUT_MS:5000}
kafka.admin.default-api-timeout-ms=${KAFKA_ADMIN_DEFAULT_API_TIMEOUT_MS:10000}

# Factor de replicación de los tópicos provisionados al arrancar.
# Default = 2 brokers locales. En AWS fijar KAFKA_TOPIC_REPLICATION_FACTOR=3
# (3 brokers, igual que los tópicos ya existentes en ese clúster).
kafka.topics.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:2}

# =========================================================
# Seguridad JWT - Microsoft Entra ID
# =========================================================
# Protege específicamente: eliminar tópicos, eliminar consumer groups y
# modificar configuración de tópicos (ver SecurityConfig). El resto de la
# API (lectura, creación de tópicos, aumentar particiones) queda abierta.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AUDIENCE}
