server.port=8089
spring.application.name=kafka-admin-service

# =========================================================
# Kafka
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}

# El servicio debe arrancar aunque Kafka no esté disponible;
# Spring solo deja un log claro en vez de abortar el contexto.
spring.kafka.admin.fail-fast=false

# Timeouts cortos para que la API REST no quede colgada si Kafka está caído.
kafka.admin.request-timeout-ms=${KAFKA_ADMIN_REQUEST_TIMEOUT_MS:5000}
kafka.admin.default-api-timeout-ms=${KAFKA_ADMIN_DEFAULT_API_TIMEOUT_MS:10000}

# Factor de replicación por defecto para los tópicos provisionados al arrancar.
kafka.topics.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:2}
