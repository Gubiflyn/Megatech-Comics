spring.application.name=inventario-service

server.port=8084

# Base de datos MySQL / Amazon RDS
spring.datasource.url=${INVENTARIO_DB_URL:jdbc:mysql://localhost:3306/megatech_inventario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${INVENTARIO_DB_USERNAME:root}
spring.datasource.password=${INVENTARIO_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Seguridad JWT - Microsoft Entra ID
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AUDIENCE}