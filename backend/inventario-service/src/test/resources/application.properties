spring.application.name=inventario-service

# H2 solo para pruebas automatizadas
spring.datasource.url=jdbc:h2:mem:inventariodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT ficticio solo para pruebas
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/test-issuer
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/test-jwks
spring.security.oauth2.resourceserver.jwt.audiences=test-audience