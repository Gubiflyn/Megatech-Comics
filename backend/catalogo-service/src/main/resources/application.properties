spring.application.name=catalogo-service

server.port=8082

spring.datasource.url=${CATALOGO_DB_URL:jdbc:mysql://localhost:3306/megatech_catalogo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CATALOGO_DB_USERNAME:root}
spring.datasource.password=${CATALOGO_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# RabbitMQ
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.acknowledge-mode=manual


# =========================================================
# APACHE KAFKA - CATALOGO POPULARES
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest


# =========================================================
# KAFKA - MANEJO DE ERRORES Y DLT
# =========================================================

# Productor utilizado para enviar mensajes fallidos a DLT
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Confirmaciones y proteccion contra duplicados del productor
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Control de offsets
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
