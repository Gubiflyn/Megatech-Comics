server:
  port: 8081

spring:
  application:
    name: usuarios-service

  datasource:
    url: ${USUARIOS_DB_URL:jdbc:mysql://localhost:3306/usuarios_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${USUARIOS_DB_USERNAME:root}
    password: ${USUARIOS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false